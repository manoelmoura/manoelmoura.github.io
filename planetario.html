<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser Vazio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
</head>
<body class="m-0 p-0 overflow-hidden">
  <div id="game-container"></div>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      parent: 'game-container',
      backgroundColor: '#000000',
      scene: {
        preload: preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);

    function criarAstro(scene, x, y, tamanho = 50, corHex = 0xffffff, orbita = null, zoom = 3, trilha = 0.5) {
        const astro = scene.add.circle(x, y, tamanho, corHex);
        astro.setInteractive();

        astro.on('pointerdown', () => {
            scene.cameras.main.startFollow(astro);
            scene.cameras.main.zoomTo(zoom, 8000);
        });
        //movimento de orbita
        if (orbita) {
            astro.orbita = {
            centro: orbita.centro, // em vez de cx e cy separados
            raio: orbita.raio,
            angulo: 0,
            velocidade: orbita.velocidade || 0.01
            };

            scene.events.on('update', () => {
            astro.orbita.angulo += astro.orbita.velocidade;
            const cx = astro.orbita.centro.x;
            const cy = astro.orbita.centro.y;
            astro.x = cx + Math.cos(astro.orbita.angulo) * astro.orbita.raio;
            astro.y = cy + Math.sin(astro.orbita.angulo) * astro.orbita.raio;
            });
        }
        //desenho da orbita
        if (orbita) {
            const graphics = scene.add.graphics();
            graphics.setDepth(-1);
            graphics.lineStyle(1, 0x1c1c1c); // cor e espessura da linha
            scene.events.on('update', () => {
                graphics.clear();
                graphics.setDepth(-1);
                graphics.lineStyle(trilha, 0x111111);
                graphics.strokeCircle(orbita.centro.x, orbita.centro.y, orbita.raio);
            });

        }

        return astro;
    }



    function preload() {
        const graphics = this.add.graphics({ lineStyle: { width: 5, color: 0xffffff } });
        graphics.fillStyle(0xffffff, 1);
        graphics.lineBetween(15, 30, 0, 50);
        graphics.strokeCircle(25, 18, 15);
        //graphics.lineBetween(20, 18, 30, 18);
        graphics.generateTexture('buttonZoomText', 50, 50);
        graphics.destroy();

        const graphics2 = this.add.graphics({ lineStyle: { width: 10, color: 0xffffff } });
        graphics2.fillStyle(0xffffff, 1);
        graphics2.strokeRect(0, 0, 50, 50);
        graphics2.fillStyle(0x000000, 1);
        graphics2.fillRect(0, 15, 50, 20);
        graphics2.fillRect(15, 0, 20, 50);
        graphics2.generateTexture('fullScreen', 50, 50);
        graphics2.destroy();
    }

    function create() {

        //CAMERA
        const spaceSize = 3000;
        this.cameras.main.setBounds(-spaceSize/2, -spaceSize/2, spaceSize, spaceSize);

        this.cameras.main.centerOn(0, 0);

        this.input.on('wheel', (pointer, gameObjects, deltaX, deltaY) => {
        const cam = this.cameras.main;
        cam.zoom -= deltaY * 0.001;
        cam.zoom = Phaser.Math.Clamp(cam.zoom, 1, 50); // limita o zoom
        });

        this.isDragging = false;
        this.dragStart = { x: 0, y: 0 };

        this.input.on('pointerdown', (pointer) => {
        if (pointer.rightButtonDown()) return; // ignora botão direito
        this.isDragging = true;
        this.dragStart.x = pointer.x;
        this.dragStart.y = pointer.y;
        });

        this.input.on('pointerup', () => {
        this.isDragging = false;
        });

        this.input.on('pointerdown', (pointer, objetos) => {
            if (objetos.length === 0) {
                this.cameras.main.stopFollow();
            }
            });

        //ESTRELAS
        for (let i = 0; i < 1800; i++) {
                const x = Phaser.Math.Between(0, spaceSize);
                const y = Phaser.Math.Between(0, spaceSize);
                const size = Phaser.Math.Between(1, 2);
                this.add.graphics().fillStyle(0xffffff, 1).fillRect(x, y, size, size).setScrollFactor(0.01);

            }

        //ASTROS
        const astroVel = 0.01;
        const moonTrace = 0.05
        const sol = criarAstro(this, 0, 0, 100, 0xffff00);
        const mercurio = criarAstro(this, 0, 0, 5, 0xffffff, { centro: sol, raio: 120, velocidade: astroVel * 1.61 }, 40);
        const venus = criarAstro(this, 0, 0, 10, 0xffa500, { centro: sol, raio: 150, velocidade: astroVel * 1.17 }, 30);
        const terra = criarAstro(this, 0, 0, 10, 0x0000ff, { centro: sol, raio: 200, velocidade: astroVel }, 30);
            const lua = criarAstro(this, 0, 0, 2, 0xffffff, { centro: terra, raio: 20, velocidade: 0.01 }, 90, moonTrace);
        const marte = criarAstro(this, 0, 0, 8, 0xff0000, { centro: sol, raio: 250, velocidade: astroVel * 0.81 }, 30);
            const fobos = criarAstro(this, 0, 0, 2, 0x884444, { centro: marte, raio: 15, velocidade: 0.02 }, 90, moonTrace);
            const deimos = criarAstro(this, 0, 0, 2, 0xeeeeee, { centro: marte, raio: 20, velocidade: 0.015 }, 90, moonTrace);
        const jupiter = criarAstro(this, 0, 0, 20, 0xffa500, { centro: sol, raio: 350, velocidade: astroVel * 0.44 }, 20);
            const io = criarAstro(this, 0, 0, 2, 0xf4c542, { centro: jupiter, raio: 25, velocidade: astroVel * 0.58 }, 90, moonTrace);
            const europa = criarAstro(this, 0, 0, 2, 0xdbe4ff, { centro: jupiter, raio: 30, velocidade: astroVel * 0.46 }, 90, moonTrace);
            const ganymedes = criarAstro(this, 0, 0, 2, 0xa9a9a9, { centro: jupiter, raio: 35, velocidade: astroVel * 0.37 }, 90, moonTrace);
            const calisto = criarAstro(this, 0, 0, 2, 0x5c5c5c, { centro: jupiter, raio: 40, velocidade: astroVel * 0.28 }, 90, moonTrace);
        const saturno = criarAstro(this, 0, 0, 15, 0xc2b280, { centro: sol, raio: 450, velocidade: astroVel * 0.33 }, 20);
            const mimas = criarAstro(this, 0, 0, 2, 0xa9a9a9, { centro: saturno, raio: 18, velocidade: astroVel * 0.48 }, 90, moonTrace);
            const encélado = criarAstro(this, 0, 0, 2, 0xddeeff, { centro: saturno, raio: 20, velocidade: astroVel * 0.42 }, 90, moonTrace);
            const tétis = criarAstro(this, 0, 0, 2, 0xc0c0c0, { centro: saturno, raio: 22, velocidade: astroVel * 0.38 }, 90, moonTrace);
            const dione = criarAstro(this, 0, 0, 2, 0xbbbbbb, { centro: saturno, raio: 24, velocidade: astroVel * 0.34 }, 90, moonTrace);
            const reia = criarAstro(this, 0, 0, 2, 0xcccccc, { centro: saturno, raio: 26, velocidade: astroVel * 0.29 }, 90, moonTrace);
            const titã = criarAstro(this, 0, 0, 2, 0xd8b365, { centro: saturno, raio: 28, velocidade: astroVel * 0.19 }, 90, moonTrace);
            const hipérion = criarAstro(this, 0, 0, 2, 0xd2b48c, { centro: saturno, raio: 30, velocidade: astroVel * 0.17 }, 90, moonTrace);
            const japeto = criarAstro(this, 0, 0, 2, 0x8b7355, { centro: saturno, raio: 32, velocidade: astroVel * 0.11 }, 90, moonTrace);
        const urano = criarAstro(this, 0, 0, 12, 0x00ffff, { centro: sol, raio: 550, velocidade: astroVel * 0.23 }, 20);
            const miranda = criarAstro(this, 0, 0, 2, 0xd8d8d8, { centro: urano, raio: 15, velocidade: astroVel * 0.22 }, 90, moonTrace);
            const ariel = criarAstro(this, 0, 0, 2, 0xdcdcdc, { centro: urano, raio: 18, velocidade: astroVel * 0.18 }, 90, moonTrace);
            const umbriel = criarAstro(this, 0, 0, 2, 0x808080, { centro: urano, raio: 20, velocidade: astroVel * 0.16 }, 90, moonTrace);
            const titânia = criarAstro(this, 0, 0, 2, 0x999999, { centro: urano, raio: 20, velocidade: astroVel * 0.12 }, 90, moonTrace);
            const oberon = criarAstro(this, 0, 0, 2, 0xa9a9a9, { centro: urano, raio: 30, velocidade: astroVel * 0.11 }, 90, moonTrace);
        const netuno = criarAstro(this, 0, 0, 10, 0x00008b, { centro: sol, raio: 650, velocidade: astroVel * 0.18 }, 20);
            const tritão = criarAstro(this, 0, 0, 2, 0xb0e0e6, { centro: netuno, raio: 20, velocidade: astroVel * 0.15 }, 90, moonTrace);
            const nereida = criarAstro(this, 0, 0, 2, 0xe0e0e0, { centro: netuno, raio: 30, velocidade: astroVel * 0.4 }, 90, moonTrace);

        //hud
        const hudCamera = this.cameras.add(0, 0, this.scale.width, this.scale.height, false, 'hudCamera');
        hudCamera.setScroll(0, 0); // Fixa ela na tela
        hudCamera.ignore(this.children.list);

        const right = this.scale.width;
        const bottom = this.scale.height;
        
        
        const buttonZoom = this.add.image(right - 150, bottom - 45, 'buttonZoomText').setInteractive().setScrollFactor(0);
        this.cameras.main.ignore(buttonZoom);
        buttonZoom.on('pointerdown', () => {
            this.cameras.main.zoomTo(1, 2000);
        });
        const buttonFullScreen = this.add.image(right - 80, bottom - 45, 'fullScreen').setInteractive().setScrollFactor(0);
        this.cameras.main.ignore(buttonFullScreen);
        
    }

    function update() {
        //CAMERA
        if (this.isDragging) {
            const pointer = this.input.activePointer;
            const dx = this.dragStart.x - pointer.x;
            const dy = this.dragStart.y - pointer.y;
            this.cameras.main.scrollX += dx / this.cameras.main.zoom;
            this.cameras.main.scrollY += dy / this.cameras.main.zoom;
            this.dragStart.x = pointer.x;
            this.dragStart.y = pointer.y;
            }

    }
  </script>
</body>
</html>
